name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to prevent Supabase free-tier project from auto-pausing
    - cron: '0 0 */3 * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keep-alive.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  ping-supabase:
    name: Ping Supabase Database & Services
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
        run: |
          python3 -c '
          import os, sys, urllib.parse, urllib.request, ssl

          raw_url = os.environ.get("RAW_URL", "").strip().strip("\"'\''")
          raw_key = os.environ.get("RAW_KEY", "").strip().strip("\"'\''")

          if not raw_url:
              print("❌ ERROR: SUPABASE_URL secret is missing in GitHub Repository Secrets!")
              print("👉 Add it in GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret")
              sys.exit(1)

          if not raw_key:
              print("❌ ERROR: SUPABASE_SERVICE_ROLE_KEY or SUPABASE_ANON_KEY secret is missing in GitHub Secrets!")
              print("👉 Add it in GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret")
              sys.exit(1)

          # Auto-fix dashboard URL if pasted by accident (e.g. https://supabase.com/dashboard/project/abcdefghijk)
          if "dashboard/project/" in raw_url:
              project_ref = raw_url.split("dashboard/project/")[1].split("/")[0]
              raw_url = f"https://{project_ref}.supabase.co"

          # Ensure https:// prefix
          if not raw_url.startswith("http://") and not raw_url.startswith("https://"):
              raw_url = f"https://{raw_url}"

          raw_url = raw_url.rstrip("/")

          print(f"📡 Pinging Supabase Project API at: {raw_url}")

          headers = {
              "apikey": raw_key,
              "Authorization": f"Bearer {raw_key}",
              "User-Agent": "NextHire-KeepAlive/1.0"
          }

          success = False

          # 1. Query "prices" table
          try:
              req = urllib.request.Request(f"{raw_url}/rest/v1/prices?select=id&limit=1", headers=headers)
              context = ssl.create_default_context()
              with urllib.request.urlopen(req, timeout=15, context=context) as resp:
                  print(f"✅ Database REST API Ping Success! Status Code: {resp.status}")
                  success = True
          except Exception as e:
              print(f"ℹ️ REST API ping note: {e}")

          # 2. Ping Auth Health endpoint
          try:
              req = urllib.request.Request(f"{raw_url}/auth/v1/health", headers={"apikey": raw_key})
              context = ssl.create_default_context()
              with urllib.request.urlopen(req, timeout=15, context=context) as resp:
                  print(f"✅ Auth Health Ping Success! Status Code: {resp.status}")
                  success = True
          except Exception as e:
              print(f"ℹ️ Auth Health ping note: {e}")

          if success:
              print("🎉 Supabase project pinged successfully! Project is active and will NOT be paused.")
          else:
              print("❌ Could not connect to Supabase project. Please check that your SUPABASE_URL and API Key secrets are correct.")
              sys.exit(1)
          '
