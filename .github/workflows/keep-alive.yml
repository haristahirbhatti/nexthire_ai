name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to prevent Supabase free-tier project from pausing
    - cron: '0 0 */3 * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keep-alive.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  ping-supabase:
    name: Ping Supabase Database & Services
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ Error: SUPABASE_URL secret is not configured in GitHub repository secrets."
            echo "Go to Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "❌ Error: SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY secret is not configured."
            echo "Go to Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          # Clean up URL trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "📡 Pinging Supabase 'prices' table..."
          
          # 1. Query 'prices' table to keep Postgres database engine active
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/prices?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "REST API (prices table) Status Code: $HTTP_STATUS"

          # 2. Ping Auth service health endpoint
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_KEY}")

          echo "Auth Service Status Code: $AUTH_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase database pinged successfully! Project is active and will not pause."
          elif [ "$AUTH_STATUS" -eq 200 ]; then
            echo "✅ Supabase Auth service pinged successfully! Project is active."
          else
            echo "⚠️ Notice: Received HTTP $HTTP_STATUS from REST API and HTTP $AUTH_STATUS from Auth service."
          fi
